name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # The binary is pure Go, and the suite runs it on each platform it is
    # released for.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: test/node
      - run: go vet ./...
      - run: go test -race ./...

  # The image holds the Linux binaries compressed with UPX. Every push builds
  # it and starts it, so a binary that UPX broke is caught here; only a tag
  # publishes it.
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true
      - run: make image-binaries
      - name: Smoke test the compressed binary
        run: |
          ls -l dist/image/open-service-bus-amd64
          dist/image/open-service-bus-amd64 -listen 127.0.0.1:5672 -queue smoke &
          pid=$!
          for i in $(seq 1 50); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5672/ || true)
            [ "$code" != 000 ] && break
            sleep 0.2
          done
          kill $pid
          [ "$code" != 000 ] || { echo "the compressed binary did not answer"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: dist/image
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make release checksums
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
